name: CI - Test & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Pytest Concurrency Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite fakeredis greenlet

      - name: Run Pytest Concurrency & Double-Entry Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+aiosqlite:///./test_payguard.db
          USE_MOCK_REDIS: "true"
          DISABLE_RATE_LIMIT: "true"
        run: |
          cd backend
          pytest -v tests/

  frontend-build:
    name: Frontend Next.js Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
